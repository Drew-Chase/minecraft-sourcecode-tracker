[package]
name = "minecraft-sourcecode-tracker"
version="0.1.3-alpha"
edition = "2024"
authors = ["Drew Chase"]
description = "This will automatically decompile each version of minecraft and commit it to a git repository and create tags for each version."
rust-version = "1.92.0"


[dependencies]
anyhow = { version = "1.0.100" }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "fs", "signal"] }
obsidian-scheduler = { version = "0.1.0", features = ["log", "callback-timers", "tokio"] }
log = { version = "0.4.29" }
pretty_env_logger = "0.5.0"
which = { version = "8.0.0" }
thiserror = { version = "2.0.17" }
chrono = { version = "0.4.42", features = ["now"] }
serde_json = { version = "1.0.145" }
reqwest = { version = "0.12.26", features = ["json"] }
git2 = { version = "0.20.3" }
clap = { version = "4.5.53", features = ["derive", "color", "help", "error-context", "string", "suggestions", "usage", "wrap_help"] }